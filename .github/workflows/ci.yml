name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      run_integration:
        description: "Run integration tests (real YouTube URLs)"
        required: false
        default: "false"
      run_benchmark:
        description: "Run performance benchmarks"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff==0.17.1
      - name: Lint
        run: ruff check . --exclude .venv,venv,build,dist,node_modules

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Install test dependencies
        run: pip install pytest==8.3.3 pytest-cov==5.0.0
      - name: Run unit tests (isolated to tests/ directory)
        run: pytest -q tests/ -m "not integration" --no-header -p no:cacheprovider --cov=rip_gui --cov-report=term --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml

  integration:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_integration == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Install test dependencies
        run: pip install pytest==8.3.3
      - name: Run integration tests (real YouTube URLs)
        run: pytest -q tests/test_integration.py --run-integration --no-header -p no:cacheprovider

  benchmark:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_benchmark == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Install ffmpeg
        run: |
          sudo apt-get update -y && sudo apt-get install -y ffmpeg
      - name: Run performance benchmark
        run: python scripts/benchmark_downloads.py --workers 1,2,3,4 --url https://www.youtube.com/watch?v=dQw4w9WgXcQ

  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test -f README.md && echo "README present"

  pin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check dependency pins
        # Fails the build on a pre-release version specifier or a
        # toolchain version that has drifted from the validated pins.
        # See scripts/pin_guard.py.
        run: python scripts/pin_guard.py .
